<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Image Gallery</title>
  <style>
    .gallery-item { display: inline-block; margin: 10px; cursor: pointer; }
    .gallery-item img { width: 200px; height: 150px; object-fit: cover; }
    .gallery-item.hidden { display: none; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; max-width: 80%; max-height: 80%; }
    .modal-content img { max-width: 100%; max-height: 60vh; }
    .close-btn { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }
    .filter-btn.active { background: #333; color: white; }
  </style>
</head>
<body>
  <h1>Dynamic Image Gallery</h1>

  <form>
    <input type="text" id="url" placeholder="Enter url" required />
    <input type="text" id="title" placeholder="Enter Title" required />
    <input type="text" id="description" placeholder="Description" required />
    <select id="Category">
      <option value="Nature">Nature</option>
      <option value="Architecture">Architecture</option>
      <option value="Animals">Animals</option>
    </select>
    <button id="Add_Image" type="button">Add Image</button>
  </form>

  <div>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Nature">Nature</button>
    <button class="filter-btn" data-filter="Architecture">Architecture</button>
    <button class="filter-btn" data-filter="Animals">Animals</button>
  </div>

  <div id="gallery"></div>

  <div id="modal" class="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div class="modal-content">
      <img id="modal-img" src="">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script>
    let images = [
      { url: 'https://picsum.photos/400/300?nature', title: 'Mountain Lake', category: 'Nature', desc: 'Beautiful mountain scenery' },
      { url: 'https://picsum.photos/400/300?city', title: 'Modern Building', category: 'Architecture', desc: 'Urban architecture design' },
      { url: 'https://picsum.photos/400/300?animal', title: 'Wild Tiger', category: 'Animals', desc: 'Majestic wild animal' },
      { url: 'https://picsum.photos/400/300?forest', title: 'Forest Path', category: 'Nature', desc: 'Peaceful forest trail' },
      { url: 'https://picsum.photos/400/300?building', title: 'Bridge Structure', category: 'Architecture', desc: 'Engineering marvel' },
      { url: 'https://picsum.photos/400/300?bird', title: 'Eagle', category: 'Animals', desc: 'Bird of prey' }
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');

    document.getElementById('Add_Image').addEventListener('click', function() {
      const url = document.getElementById('url').value;
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const category = document.getElementById('Category').value;

      if (!url || !title) return;

      const newImage = {
        url: url,
        title: title,
        category: category,
        desc: description
      };

      images.push(newImage);
      renderGallery();

      document.getElementById('url').value = '';
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
    });

    function renderGallery() {
      gallery.innerHTML = '';
      const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

      images.forEach((img, index) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.dataset.category = img.category;
        if (activeFilter !== 'all' && img.category !== activeFilter) {
          div.classList.add('hidden');
        }
        div.innerHTML = `<img src="${img.url}" alt="${img.title}"><p>${img.title}</p>`;
        div.onclick = () => openModal(index);
        gallery.appendChild(div);
      });
    }

    function openModal(index) {
      const img = images[index];
      document.getElementById('modal-img').src = img.url;
      document.getElementById('modal-title').textContent = img.title;
      document.getElementById('modal-desc').textContent = img.desc;
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderGallery();
      });
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    renderGallery();
  </script>
</body>
</html>
